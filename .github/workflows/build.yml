name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          brew install wireguard-tools   # lets the installer transaction test run
          Tests/run.sh

      - name: Tests under Thread Sanitizer
        run: SANITIZE=thread Tests/run.sh

      - name: Strict concurrency check (Swift 6 rules)
        run: |
          out=$(swiftc -typecheck -strict-concurrency=complete -target arm64-apple-macos13 Sources/*.swift 2>&1 || true)
          n=$(echo "$out" | grep -cE '^Sources/.*warning:' || true)
          echo "$out" | grep -E '^Sources/.*warning:' || true
          echo "strict concurrency warnings: $n"
          test "$n" -eq 0

      - name: Build
        run: |
          ./build.sh
          mv build/WGToggle.dmg "build/WGToggle-$VERSION.dmg"
          (cd build && shasum -a 256 "WGToggle-$VERSION.dmg" > "WGToggle-$VERSION.dmg.sha256")
          cat "build/WGToggle-$VERSION.dmg.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: build/WGToggle-*.dmg*

  integration:
    # Real system: a real wg-quick tunnel, the CLI, the real helper install and helper-driven up/down.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Integration test
        run: |
          brew install wireguard-tools
          ./build.sh
          Tests/integration.sh

  release:
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: WGToggle-*.dmg

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          ### Install
          \`\`\`
          brew install --cask ppodolak/tap/wgtoggle
          \`\`\`
          Or download \`WGToggle-$VERSION.dmg\` and drag WGToggle into Applications. The app is not notarized: on first launch right-click it and choose **Open**.

          Requires macOS 13+ and Homebrew (wireguard-tools is installed automatically). Changes: [CHANGELOG.md](https://github.com/$REPO/blob/main/CHANGELOG.md).
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" \
            "WGToggle-$VERSION.dmg" "WGToggle-$VERSION.dmg.sha256" \
            --title "WGToggle $VERSION" --notes-file notes.md --generate-notes

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          [[ -n "$TAP_TOKEN" ]] || { echo "TAP_TOKEN not set, skipping"; exit 0; }
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 "WGToggle-$VERSION.dmg.sha256")
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ppodolak/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/wgtoggle.rb
          git -c user.name="Paweł Podolak" -c user.email="ppodolak@users.noreply.github.com" commit -am "wgtoggle $VERSION"
          git push origin HEAD
