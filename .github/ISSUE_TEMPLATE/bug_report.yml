name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste a full .conf file** (it contains your private key).
        Security problems: please use [private reporting](https://github.com/ppodolak/wgtoggle/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: WGToggle version
      description: Menu → About WGToggle
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.3"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: Diagnose output
      description: "Output of `/Applications/WGToggle.app/Contents/MacOS/WGToggle --diagnose` (prints no keys)"
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Relevant entries from menu → Log Explorer
      render: text
  - type: dropdown
    id: passwordless
    attributes:
      label: Passwordless mode
      options: ["Off", "On"]
