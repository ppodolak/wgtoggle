name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Tests
        run: Tests/run.sh

      - name: Build
        run: |
          ./build.sh
          mv build/WGToggle.dmg "build/WGToggle-$VERSION.dmg"
          (cd build && shasum -a 256 "WGToggle-$VERSION.dmg" > "WGToggle-$VERSION.dmg.sha256")
          cat "build/WGToggle-$VERSION.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: WGToggle-${{ env.VERSION }}
          path: build/WGToggle-*.dmg*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ### Install
          1. Download \`WGToggle-$VERSION.dmg\` and drag WGToggle into Applications.
          2. The app is not notarized. On first launch right-click it and choose **Open**, or run
             \`xattr -dr com.apple.quarantine /Applications/WGToggle.app\`.

          Requires macOS 13+ and Homebrew (wireguard-tools is installed automatically).
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "build/WGToggle-$VERSION.dmg" "build/WGToggle-$VERSION.dmg.sha256" \
            --title "WGToggle $VERSION" --notes-file notes.md --generate-notes
